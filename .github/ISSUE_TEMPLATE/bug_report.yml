name: Bug report
description: Signaler un comportement incorrect ou une régression
title: "[Bug] "
labels:
  - bug
body:
  - type: textarea
    id: context
    attributes:
      label: Contexte
      description: Décrire le contexte fonctionnel.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Étapes pour reproduire
      description: Fournir des étapes minimales et reproductibles.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Comportement attendu
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Comportement observé
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Domaine
      options:
        - Core SaaS
        - Directory Engine
        - Profils
        - Entreprises / Organisations
        - Annonces
        - Documents / Archives
        - Location Core
        - Search
        - DataExchange
        - Claims / Verification
        - Moderation
        - External Profiles
        - Web / Livewire
        - Flutter
        - Infrastructure
        - Documentation
        - Autre
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / informations techniques
      description: Ne jamais inclure de secrets, tokens ou données KYC.

  - type: checkboxes
    id: sensitive
    attributes:
      label: Sécurité
      options:
        - label: J'ai vérifié que ce ticket ne contient aucun secret ni donnée sensible.
          required: true
